#:schema https://mise.jdx.dev/schema/mise.json

[bootstrap.mise_shell_activate]
bash = true
fish = "auto"
zsh = false   # handled in zshrc

[bootstrap.services.mise-history]
builtin = "history-watch"

[bootstrap.services.pitchfork]
scope = "user"
command = "/home/ben/.local/bin/mise exec -- pitchfork supervisior run --boot"
environment = { PITCHFORK_MISE_BIN = "/home/ben/.local/bin/mise" }
working_directory = "~"
requires_tools = true
restart = "on-failure"

[env]
EDITOR = "nvim"

[settings]
activate_aggressive = true
color_theme = "catppuccin"
experimental = true
idiomatic_version_file_enable_tools = [
  # https://mise.jdx.dev/dev-tools/versions.html#idiomatic-version-files
  "bun",
  "go",
  "golangci-lint",
  "node",
  "npm",
  "opentofu",
  "pnpm",
  "python",
  "ruby",
  "rust",
  "terraform",
  "terragrunt",
  "yarn",
]
lockfile = true

[settings.gitlab]
use_git_credentials = true

[settings.github]
use_git_credentials = true

[settings.self_update]
auto = true

[settings.tool_update]
global_auto = true

[settings.upgrade]
auto_prune = true

[tools]
aube = { version = "latest", workflow = [
  "release-plz.yml@refs/heads/main",
  "release.yml@refs/heads/main",
] }
fnox = "latest"
hk = { version = "latest", workflow = "release.yml" }
pitchfork = { version = "latest", workflow = "release.yml@refs/heads/main" }
usage = "latest"
